const OFF=new Set(["QB","RB","WR","TE","OL","OT","OG","C","P","PK","LS"]);
const side=p=>OFF.has(p.position)?"Offense":"Defense";
function render(){
 const query=q.value.toLowerCase(),s=sideEl.value,p=pos.value;
 const rows=PLAYERS.filter(x=>(!query||x.name.toLowerCase().includes(query))&&(s==="All"||side(x)===s)&&(p==="All Positions"||x.position===p));
 grid.innerHTML=rows.map((x,i)=>`<article class=card onclick="openPlayer(${PLAYERS.indexOf(x)})"><div class=photo><img src="${x.image}" alt="${x.name}" onerror="this.src='ulm_logo_official.png'"></div><div class=body><div class=num>#${x.number} · ${x.position}</div><div class=name>${x.name}</div><div class=meta>${x.classYear} · ${x.height} · ${x.weight} lbs<br>${x.previous||"UAB"}</div><div class=open>Open Full Profile →</div></div></article>`).join("");
}
function openPlayer(i){
 const x=PLAYERS[i];
 drawer.innerHTML=`<div class=drawer-head><img src="${x.image}" onerror="this.src='ulm_logo_official.png'"><div><div class=ey>#${x.number} · ${x.position}</div><h2>${x.name}</h2><div>${x.classYear} · ${x.height} · ${x.weight} lbs</div></div><button class=close onclick="closePlayer()">×</button></div><div class=drawer-body><div class=profile-grid><div class=fact><b>${x.position}</b><span>Position</span></div><div class=fact><b>${x.height}</b><span>Height</span></div><div class=fact><b>${x.weight}</b><span>Weight</span></div><div class=fact><b>${x.classYear}</b><span>Class</span></div><div class=fact><b>${x.hometown}</b><span>Hometown</span></div><div class=fact><b>${x.previous||"UAB"}</b><span>Previous School</span></div></div><div class=bio-copy><h3>Player Background</h3><p>${x.summary}</p><p>This profile uses official UAB roster information. The official player page contains the complete year-by-year biography, statistics and media.</p><a class=official href="${x.bioUrl}" target="_blank">Open Complete Official UAB Bio →</a></div></div>`;
 overlay.classList.add("show");drawer.classList.add("show");
}
function closePlayer(){overlay.classList.remove("show");drawer.classList.remove("show")}
overlay.onclick=closePlayer;
const sideEl=document.getElementById("side");
pos.innerHTML+=Array.from(new Set(PLAYERS.map(x=>x.position))).sort().map(x=>`<option>${x}</option>`).join("");
[q,sideEl,pos].forEach(x=>x.oninput=render);render();
</script></body></html>
