<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ULM Football Analytics Platform</title>
<style>
:root{--m:#6b0016;--n:#0b1f3a;--g:#b9975b;--bg:#f4f6f9;--p:#fff;--l:#d9dee7;--t:#172033;--u:#687287}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--t)}header{background:linear-gradient(135deg,var(--m),#300008);color:white;padding:22px 28px;border-bottom:5px solid var(--g);display:flex;justify-content:space-between;align-items:center}h1{margin:3px 0}.ey{color:var(--g);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.up{background:white;color:var(--m);font-weight:800;padding:11px 14px;border-radius:9px;cursor:pointer}.up input{display:none}.status,.filters,.tabs{padding:12px 28px;background:white;border-bottom:1px solid var(--l)}.status{display:flex;gap:18px;color:var(--u);font-weight:700;font-size:13px}.filters{display:grid;grid-template-columns:repeat(6,1fr);gap:9px}.filters label,.subf label{font-size:11px;color:var(--u);font-weight:800;text-transform:uppercase}.filters select,.subf select{width:100%;margin-top:4px;padding:8px;border:1px solid var(--l);border-radius:7px}.tabs{display:flex;gap:7px;flex-wrap:wrap;background:transparent}.tabs button{border:1px solid var(--l);background:white;padding:9px 12px;border-radius:8px;font-weight:700;color:var(--u)}.tabs button.a{background:var(--n);color:white}main{padding:22px 28px}.empty,.panel{background:white;border:1px solid var(--l);border-radius:14px;padding:22px}.empty{max-width:650px;margin:50px auto;text-align:center}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:11px}.card{background:white;border:1px solid var(--l);border-top:4px solid var(--g);border-radius:12px;padding:14px}.ct{font-size:11px;text-transform:uppercase;color:var(--u);font-weight:800}.cv{font-size:26px;color:var(--m);font-weight:900;margin-top:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-top:17px}.tw{overflow:auto;background:white;border:1px solid var(--l);border-radius:12px}table{border-collapse:collapse;width:100%;font-size:12px}th{background:var(--m);color:white;text-align:left;padding:8px;white-space:nowrap}td{padding:8px;border-top:1px solid var(--l);white-space:nowrap}tr:nth-child(even)td{background:#fafbfe}.barrow{display:grid;grid-template-columns:120px 1fr 55px;gap:8px;align-items:center;margin:7px 0}.bb{height:19px;background:#edf0f5;border-radius:4px;overflow:hidden}.bar{height:100%;background:var(--m)}.bar.n{background:var(--n)}.subf{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin-bottom:14px}.hide{display:none}.slider{display:grid;grid-template-columns:210px 1fr 60px;gap:12px;align-items:center}.slider input{width:100%}.note{color:var(--u);font-size:13px}@media(max-width:1000px){.filters,.subf{grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}}@media print{header,.filters,.tabs,.status{display:none!important}}
</style></head><body>
<header><div><div class="ey">ULM Football</div><h1>ULM Football Analytics Platform</h1><div>Offense, defense, team comparison, projections, and first downs</div></div><label class="up">Upload CSV<input id="file" type="file" accept=".csv"></label></header>
<div id="status" class="status"><span>No file loaded</span></div><div id="filters" class="filters hide"></div><div id="tabs" class="tabs hide"></div>
<main><section id="empty" class="empty"><h2>Upload a merged PFF + Advantage CSV</h2><p>Single opponent or full multi-team file.</p></section><section id="content" class="hide"></section></main>
<script>
const N={ALBI:"UAB",CTUN:"Connecticut",FLAT:"Florida Atlantic",FLIN:"Florida International",FLSO:"South Florida",LATU:"Tulane",MDNA:"Navy",MDUN:"Maryland",NCEA:"East Carolina",OKTU:"Tulsa",TNMS:"Memphis",TXRI:"Rice"};
let P=[],F=[],tab="Dashboard",G={},rate=70,FD={dd:"All",adv:"All",rp:"All",form:"All",off:"All",def:"All"};
function parse(t){let R=[],r=[],c="",q=false;for(let i=0;i<t.length;i++){let x=t[i],y=t[i+1];if(x=='"'&&q&&y=='"'){c+='"';i++}else if(x=='"')q=!q;else if(x==','&&!q){r.push(c);c=""}else if((x=='\n'||x=='\r')&&!q){if(x=='\r'&&y=='\n')i++;r.push(c);if(r.some(v=>v!==""))R.push(r);r=[];c=""}else c+=x}if(c||r.length){r.push(c);R.push(r)}let h=R.shift().map(x=>x.trim());return R.map(a=>Object.fromEntries(h.map((k,i)=>[k,(a[i]||"").trim()])))}
const num=v=>Number.isFinite(Number(v))?Number(v):null, pres=v=>v!=null&&String(v).trim()!==""&&String(v).toUpperCase()!=="NAN", school=v=>N[String(v||"").toUpperCase()]||String(v||"").toUpperCase();
function dd(d,x,g){if(!d||x==null)return"Unknown";if(g!=null&&Math.round(g)==Math.round(x))return d+" & Goal";if(d==1)return Math.abs(x-10)<.01?"1st & 10":x>=15?"1st & 15+":"1st & Other";let b=x<=3?"1-3":x<=6?"4-6":x<=9?"7-9":x<=12?"10-12":"13+";return(d==2?"2nd":d==3?"3rd":"4th")+" & "+b}
function norm(r,i){let y=num(r.pff_GAINLOSSNET),d=num(r.pff_DOWN),x=num(r.pff_DISTANCE),g=num(r.pff_YARDS_TO_GOAL_LINE),rp=(r.pff_RUNPASS||"").toUpperCase(),pr=(r.pff_PASSRESULT||"").toUpperCase(),co=pr=="COMPLETE",sa=pres(r.pff_SACK)||pr=="SACK",it=pres(r.pff_INTERCEPTION)||pr=="INTERCEPTION",fu=pres(r.pff_FUMBLE),inc=rp=="P"&&!co&&!sa&&!it,a=(r["Num Ad"]||"").toUpperCase();return{id:i,off:school(r.pff_OFFTEAM),def:school(r.pff_DEFTEAM),down:d,dist:x,y,rp,form:(r["Chart Formation"]||"").toUpperCase(),pers:String(r.pff_OFF_PERSONNEL_GROUP||"").replace(/\.0$/,""),fzg:(r["FZ Advantage"]||"").toUpperCase(),fza:(r["FZ Attacked"]||"").toUpperCase(),adv:a=="YES"?true:a=="NO"?false:null,route:r.pff_ROUTE_THROWN||"",rush:(String(r.pff_PASSRUSHPLAYERS||"").match(/^\s*(\d+)/)||[])[1]||"",epa:num(r.pff_EXPECTED_POINTS_ADDED),fd:Number(r.pff_FIRST_DOWN_GAINED||0)==1,ex:y!=null&&y>=15,neg:(y!=null&&y<=0)||inc||sa||it||fu,co,sa,it,scr:pres(r.pff_QBSCRAMBLE),td:pres(r.pff_TOUCHDOWN),dd:dd(d,x,g)}}
const av=a=>{a=a.filter(Number.isFinite);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null},med=a=>{a=a.filter(Number.isFinite).sort((x,y)=>x-y);if(!a.length)return null;let m=Math.floor(a.length/2);return a.length%2?a[m]:(a[m-1]+a[m])/2},pc=(n,d)=>d?100*n/d:null;
function S(l,p){let q=p.filter(x=>x.rp=="P");return{label:l,plays:p.length,ypp:av(p.map(x=>x.y)),median:med(p.map(x=>x.y)),first:pc(p.filter(x=>x.fd).length,p.length),epa:av(p.map(x=>x.epa)),expl:pc(p.filter(x=>x.ex).length,p.length),neg:pc(p.filter(x=>x.neg).length,p.length),sack:pc(q.filter(x=>x.sa).length,q.length),intr:pc(q.filter(x=>x.it).length,q.length),scr:pc(q.filter(x=>x.scr).length,q.length),comp:pc(q.filter(x=>x.co).length,q.length),adv:pc(p.filter(x=>x.adv===true).length,p.length),td:pc(p.filter(x=>x.td).length,p.length)}}
const f=(v,d=2)=>v==null||Number.isNaN(v)?"-":Number(v).toFixed(d),fp=v=>v==null||Number.isNaN(v)?"-":Number(v).toFixed(1)+"%";
function grp(p,k){return p.reduce((a,x)=>{let z=k(x)||"-";(a[z]??=[]).push(x);return a},{})}
function table(rows){return`<div class=tw><table><thead><tr><th>Label</th><th>Plays</th><th>YPP</th><th>Med</th><th>1st %</th><th>EPA</th><th>Expl %</th><th>Neg %</th><th>Sack %</th><th>INT %</th><th>Scr %</th><th>Comp %</th><th>Adv %</th></tr></thead><tbody>`+rows.map(r=>`<tr><td>${r.label}</td><td>${r.plays}</td><td>${f(r.ypp)}</td><td>${f(r.median,1)}</td><td>${fp(r.first)}</td><td>${f(r.epa)}</td><td>${fp(r.expl)}</td><td>${fp(r.neg)}</td><td>${fp(r.sack)}</td><td>${fp(r.intr)}</td><td>${fp(r.scr)}</td><td>${fp(r.comp)}</td><td>${fp(r.adv)}</td></tr>`).join("")+"</tbody></table></div>"}
function bars(rows,k,t,cl=""){let m=Math.max(...rows.map(r=>r[k]||0),1);return`<div class=panel><h3>${t}</h3>`+rows.map(r=>`<div class=barrow><span>${r.label}</span><div class=bb><div class="bar ${cl}" style="width:${100*(r[k]||0)/m}%"></div></div><b>${f(r[k],1)}</b></div>`).join("")+"</div>"}
function opts(v){return["All",...Array.from(new Set(v.filter(x=>x!==""&&x!=null).map(String))).sort()]}
function sel(n,v,cur){return`<label>${n}<select data-fd="${n}">${opts(v).map(x=>`<option ${x==cur?"selected":""}>${x}</option>`).join("")}</select></label>`}
function filters(){let e=document.getElementById("filters");e.classList.remove("hide");e.innerHTML="";[["Offense",x=>x.off],["Defense",x=>x.def],["Formation",x=>x.form],["Personnel",x=>x.pers],["Advantage",x=>x.adv===true?"Advantaged":x.adv===false?"Non-Advantaged":""],["FZ Given",x=>x.fzg],["FZ Attacked",x=>x.fza],["Down-Distance",x=>x.dd],["Run/Pass",x=>x.rp],["Route",x=>x.route],["Rushers",x=>x.rush]].forEach(([n,k])=>{G[n]="All";let l=document.createElement("label");l.textContent=n;let s=document.createElement("select");opts(P.map(k)).forEach(o=>{let x=document.createElement("option");x.textContent=o;s.appendChild(x)});s.onchange=()=>{G[n]=s.value;apply()};l.appendChild(s);e.appendChild(l)})}
function tabs(){let a=["Dashboard","Offense","Defense","Team Comparison","Projected Totals","First Down Explorer","Field Zones","Routes","Situations","PDF Export"],e=document.getElementById("tabs");e.classList.remove("hide");e.innerHTML="";a.forEach(n=>{let b=document.createElement("button");b.textContent=n;b.className=n==tab?"a":"";b.onclick=()=>{tab=n;tabs();render()};e.appendChild(b)})}
function apply(){F=P.filter(p=>(G.Offense=="All"||p.off==G.Offense)&&(G.Defense=="All"||p.def==G.Defense)&&(G.Formation=="All"||p.form==G.Formation)&&(G.Personnel=="All"||p.pers==G.Personnel)&&(G.Advantage=="All"||(G.Advantage=="Advantaged"?p.adv===true:p.adv===false))&&(G["FZ Given"]=="All"||p.fzg==G["FZ Given"])&&(G["FZ Attacked"]=="All"||p.fza==G["FZ Attacked"])&&(G["Down-Distance"]=="All"||p.dd==G["Down-Distance"])&&(G["Run/Pass"]=="All"||p.rp==G["Run/Pass"])&&(G.Route=="All"||p.route==G.Route)&&(G.Rushers=="All"||String(p.rush)==G.Rushers));document.getElementById("status").innerHTML=`<span>${P.length} plays</span><span>${F.length} filtered</span><span>${new Set(P.map(x=>x.off)).size} offenses</span><span>${new Set(P.map(x=>x.def)).size} defenses</span>`;render()}
function cards(o){return`<div class=cards>${[["Filtered plays",o.plays],["Yards/play",f(o.ypp)],["Advantage rate",fp(o.adv)],["First down %",fp(o.first)],["Negative %",fp(o.neg)],["Completion %",fp(o.comp)]].map(x=>`<div class=card><div class=ct>${x[0]}</div><div class=cv>${x[1]}</div></div>`).join("")}</div>`}
function proj(p,r){let a=S("A",p.filter(x=>x.adv===true)),n=S("N",p.filter(x=>x.adv===false)),z=r/100,m=k=>(a[k]||0)*z+(n[k]||0)*(1-z);return{label:r+"% Advantage",plays:p.length,ypp:m("ypp"),median:m("median"),first:m("first"),epa:m("epa"),expl:m("expl"),neg:m("neg"),sack:m("sack"),intr:m("intr"),scr:m("scr"),comp:m("comp"),adv:r,td:m("td")}}
function render(){let e=document.getElementById("content");e.classList.remove("hide");document.getElementById("empty").classList.add("hide");let o=S("Filtered",F),sp=[S("All",F),S("Advantaged",F.filter(x=>x.adv===true)),S("Non-Advantaged",F.filter(x=>x.adv===false))],forms=Object.entries(grp(F,x=>x.form)).map(([k,v])=>S(k,v)).sort((a,b)=>b.plays-a.plays),eff=[...forms].filter(r=>r.plays>=10).sort((a,b)=>(b.ypp||-999)-(a.ypp||-999)).slice(0,10);
if(tab=="Dashboard")e.innerHTML=cards(o)+`<div class=grid>${bars(sp,"ypp","Advantage split")}${bars(eff,"ypp","Formation efficiency")}</div>`;
else if(tab=="Offense"){let r=Object.entries(grp(F,x=>x.off)).map(([k,v])=>S(k,v)).sort((a,b)=>b.plays-a.plays);e.innerHTML="<h2>Offense</h2>"+cards(o)+"<h3>Team splits</h3>"+table(r)+"<h3>Formations</h3>"+table(forms.slice(0,15))}
else if(tab=="Defense"){let r=Object.entries(grp(F,x=>x.def)).map(([k,v])=>S(k+" allowed",v)).sort((a,b)=>b.plays-a.plays);e.innerHTML="<h2>Defense</h2><p class=note>Metrics show production allowed; Negative % is negative plays forced.</p>"+table(r)+`<div class=grid>${bars(r.slice(0,10),"ypp","YPP allowed")}${bars(r.slice(0,10),"neg","Negative plays forced","n")}</div>`}
else if(tab=="Team Comparison"){let a=Object.entries(grp(F,x=>x.off)).map(([k,v])=>S(k,v)).sort((x,y)=>(y.ypp||0)-(x.ypp||0)),d=Object.entries(grp(F,x=>x.def)).map(([k,v])=>S(k,v)).sort((x,y)=>(y.ypp||0)-(x.ypp||0));e.innerHTML="<h2>Team Comparison</h2><div class=grid><div><h3>Offensive production</h3>"+table(a)+"</div><div><h3>Defensive production allowed</h3>"+table(d)+"</div></div>"}
else if(tab=="Projected Totals"){let r=proj(F,rate),plays=70,yd=(r.ypp||0)*plays,fd=(r.first||0)/100*plays,ex=(r.expl||0)/100*plays,ng=(r.neg||0)/100*plays,pts=(r.td||0)/100*plays*7;e.innerHTML=`<h2>Projected Totals</h2><div class=panel><div class=slider><b>Advantage execution rate</b><input id=sl type=range min=0 max=100 value=${rate}><strong>${rate}%</strong></div><p class=note>Uses actual advantaged and non-advantaged production. Game estimate assumes 70 plays.</p></div><div class=cards>${[["Projected YPP",f(r.ypp)],["Projected yards",f(yd,0)],["Projected first downs",f(fd,1)],["Projected explosives",f(ex,1)],["Projected negatives",f(ng,1)],["Projected points",f(pts,1)]].map(x=>`<div class=card><div class=ct>${x[0]}</div><div class=cv>${x[1]}</div></div>`).join("")}</div><h3>Projected mix</h3>${table([r])}`;document.getElementById("sl").oninput=x=>{rate=Number(x.target.value);render()}}
else if(tab=="First Down Explorer"){let p=F.filter(x=>x.fd).filter(x=>FD.dd=="All"||x.dd==FD.dd).filter(x=>FD.adv=="All"||(FD.adv=="Advantaged"?x.adv===true:x.adv===false)).filter(x=>FD.rp=="All"||x.rp==FD.rp).filter(x=>FD.form=="All"||x.form==FD.form).filter(x=>FD.off=="All"||x.off==FD.off).filter(x=>FD.def=="All"||x.def==FD.def),fo=Object.entries(grp(p,x=>x.form)).map(([k,v])=>S(k,v)).sort((a,b)=>b.plays-a.plays),ddr=Object.entries(grp(p,x=>x.dd)).map(([k,v])=>S(k,v)).sort((a,b)=>b.plays-a.plays);e.innerHTML=`<h2>First Down Explorer</h2><p class=note>Only first-down plays are loaded.</p><div class=subf>${sel("Down-Distance",F.map(x=>x.dd),FD.dd)}${sel("Advantage",["Advantaged","Non-Advantaged"],FD.adv)}${sel("Run/Pass",["R","P"],FD.rp)}${sel("Formation",F.map(x=>x.form),FD.form)}${sel("Offense",F.map(x=>x.off),FD.off)}${sel("Defense",F.map(x=>x.def),FD.def)}</div>${cards(S("First Downs",p))}<div class=grid><div><h3>By formation</h3>${table(fo.slice(0,15))}</div><div><h3>By down-distance</h3>${table(ddr)}</div></div>`;document.querySelectorAll("[data-fd]").forEach(s=>s.onchange=x=>{let m={"Down-Distance":"dd","Advantage":"adv","Run/Pass":"rp","Formation":"form","Offense":"off","Defense":"def"};FD[m[x.target.dataset.fd]]=x.target.value;render()})}
else if(tab=="Field Zones"){let form=G.Formation!="All"?G.Formation:(forms[0]?.label||""),z=["FIELD","BOUNDARY","BOX"],p=F.filter(x=>x.form==form),b=z.map(g=>`<tr><td><b>${g}</b></td>`+z.map(a=>{let r=S(a,p.filter(x=>x.fzg==g&&x.fza==a));return`<td><b>${f(r.ypp,1)} YPP</b><br>Med ${f(r.median,1)}<br>${fp(r.first)} 1st<br>${fp(r.neg)} neg<br>n=${r.plays}</td>`}).join("")+"</tr>").join("");e.innerHTML=`<h2>FZ Given x FZ Attacked — ${form}</h2><div class=tw><table><thead><tr><th>FZ Given</th><th>Attack Field</th><th>Attack Boundary</th><th>Attack Box</th></tr></thead><tbody>${b}</tbody></table></div>`}
else if(tab=="Routes"){let r=Object.entries(grp(F.filter(x=>x.rp=="P"&&x.route),x=>x.route+" | "+(x.dist<=3?"1-3":x.dist<=6?"4-6":x.dist<=9?"7-9":x.dist<=12?"10-12":"13+"))).map(([k,v])=>S(k,v)).filter(x=>x.plays>=2).sort((a,b)=>b.plays-a.plays).slice(0,30);e.innerHTML="<h2>Routes</h2>"+table(r)}
else if(tab=="Situations"){let r=Object.entries(grp(F.filter(x=>x.dd!="Unknown"&&x.dd!="1st & Other"),x=>x.dd)).map(([k,v])=>S(k,v)).filter(x=>x.plays>=5);e.innerHTML="<h2>Situations</h2>"+table(r)}
else e.innerHTML='<div class=panel><h2>PDF Export</h2><button onclick="window.print()">Print / Save PDF</button></div>'}
document.getElementById("file").onchange=e=>{let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{let rows=parse(r.result);P=rows.map(norm).filter((p,i)=>String(rows[i].pff_NOPLAY||"0")!="1"&&p.y!=null&&["R","P"].includes(p.rp)&&p.form&&["FIELD","BOUNDARY","BOX","MOF"].includes(p.fzg));F=P;filters();tabs();apply()};r.readAsText(file)}
</script></body></html>
