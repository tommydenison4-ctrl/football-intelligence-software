<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ULM Football Analytics</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
:root{--m:#6b0016;--n:#0b1f3a;--g:#b9975b;--bg:#f4f6f9;--p:#fff;--l:#d9dee7;--t:#172033;--u:#687287}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--t)}
button,input,select{font:inherit}
header{background:linear-gradient(135deg,var(--m),#2c0008);color:white;padding:22px 28px;border-bottom:5px solid var(--g);display:flex;justify-content:space-between;align-items:center;gap:18px}
h1{margin:3px 0}.ey{color:var(--g);font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
main{padding:24px 28px}.panel,.card,.auth{background:white;border:1px solid var(--l);border-radius:14px;padding:18px}
.auth{width:min(440px,90vw);margin:70px auto}.auth input,.form input,.form select{width:100%;padding:10px;border:1px solid var(--l);border-radius:8px;margin:5px 0 11px}
button{background:var(--m);color:white;border:0;border-radius:8px;padding:10px 13px;font-weight:800;cursor:pointer}
.note{color:var(--u);font-size:13px;margin-top:8px}.hide{display:none}
.grid{display:grid;grid-template-columns:repeat(5,minmax(140px,1fr));gap:11px}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:11px;margin-bottom:18px}
.metric{background:white;border:1px solid var(--l);border-top:4px solid var(--g);border-radius:12px;padding:14px}.mt{font-size:11px;color:var(--u);font-weight:900;text-transform:uppercase}.mv{font-size:26px;color:var(--m);font-weight:900;margin-top:5px}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:15px 0}.tabs button{background:white;color:var(--u);border:1px solid var(--l)}.tabs button.a{background:var(--n);color:white}
.tw{overflow:auto;background:white;border:1px solid var(--l);border-radius:12px}table{width:100%;border-collapse:collapse;font-size:12px}th{background:var(--m);color:white;text-align:left;padding:8px;white-space:nowrap}td{padding:8px;border-top:1px solid var(--l);white-space:nowrap}tr:nth-child(even)td{background:#fafbfe}
.projects{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.project{background:white;border:1px solid var(--l);border-radius:12px;padding:15px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.status{padding:10px 28px;background:white;border-bottom:1px solid var(--l);color:var(--u);font-size:13px;font-weight:700}.form{margin-bottom:20px}
@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:repeat(3,1fr)}.projects{grid-template-columns:1fr 1fr}}
@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}.cards{grid-template-columns:1fr 1fr}.projects{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<div><div class="ey">ULM Football</div><h1>Football Analytics Platform</h1><div>Supabase-connected dashboard</div></div>
<button id="signOut" class="hide">Sign out</button>
</header>
<div id="status" class="status">Loading...</div>
<main>
<section id="auth" class="auth hide">
<h2>Owner Sign-In</h2>
<input id="email" type="email" placeholder="Email address">
<button id="sendLink">Email me a sign-in link</button>
<div id="authMsg" class="note"></div>
</section>

<section id="projectsView" class="hide">
<div class="panel form">
<h2>Create Project</h2>
<div class="grid">
<label>Project name<input id="pname"></label>
<label>Subject team<input id="pteam"></label>
<label>Season<input id="pseason" type="number" value="2026"></label>
<label>Project type<select id="ptype"><option value="opponent">Opponent</option><option value="league">League Database</option><option value="self_scout">ULM Self Scout</option></select></label>
<label>CSV<input id="pcsv" type="file" accept=".csv"></label>
</div>
<button id="createProject">Create and Import</button>
<div id="projectMsg" class="note"></div>
</div>
<h2>Projects</h2>
<div id="projects" class="projects"></div>
</section>

<section id="dashboard" class="hide">
<button id="back">Back to Projects</button>
<h2 id="projectTitle"></h2>
<div id="tabs" class="tabs"></div>
<div id="content"></div>
</section>
</main>
<script>
const SUPABASE_URL="https://hzrosmevuejjlxigdxmg.supabase.co";
const SUPABASE_KEY="sb_publishable_FtmUeN1QkLlkRIqCIdQ5gw_KDbEFy1H";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const TEAM={ALBI:"UAB",CTUN:"Connecticut",FLAT:"Florida Atlantic",FLIN:"Florida International",FLSO:"South Florida",LATU:"Tulane",MDNA:"Navy",MDUN:"Maryland",NCEA:"East Carolina",OKTU:"Tulsa",TNMS:"Memphis",TXRI:"Rice"};
let session=null,currentProject=null,plays=[],tab="Dashboard";

const $=id=>document.getElementById(id), show=(id,on=true)=>$(id).classList.toggle("hide",!on);
const num=v=>Number.isFinite(Number(v))?Number(v):null;
const present=v=>v!==undefined&&v!==null&&String(v).trim()!==""&&String(v).trim().toUpperCase()!=="NAN";
const school=v=>TEAM[String(v||"").trim().toUpperCase()]||String(v||"").trim().toUpperCase();

function ddBucket(d,dist,ytg){
 if(!d||dist===null)return"Unknown";
 if(ytg!==null&&Math.round(ytg)===Math.round(dist))return d+" & Goal";
 if(d===1)return Math.abs(dist-10)<.01?"1st & 10":dist>=15?"1st & 15+":"1st & Other";
 let b=dist<=3?"1-3":dist<=6?"4-6":dist<=9?"7-9":dist<=12?"10-12":"13+";
 return(d===2?"2nd":d===3?"3rd":"4th")+" & "+b;
}
function parseRushers(v){const m=String(v||"").match(/^\s*(\d+)/);return m?Number(m[1]):null}
function avg(a){a=a.filter(Number.isFinite);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null}
function med(a){a=a.filter(Number.isFinite).sort((x,y)=>x-y);if(!a.length)return null;let m=Math.floor(a.length/2);return a.length%2?a[m]:(a[m-1]+a[m])/2}
function pct(n,d){return d?100*n/d:null}
function sum(label,p){const pass=p.filter(x=>x.run_pass==="P");return{label,plays:p.length,ypp:avg(p.map(x=>Number(x.yards))),median:med(p.map(x=>Number(x.yards))),first:pct(p.filter(x=>x.first_down).length,p.length),epa:avg(p.map(x=>Number(x.epa))),expl:pct(p.filter(x=>x.explosive).length,p.length),neg:pct(p.filter(x=>x.negative).length,p.length),sack:pct(pass.filter(x=>x.sack).length,pass.length),intr:pct(pass.filter(x=>x.interception).length,pass.length),scr:pct(pass.filter(x=>x.scramble).length,pass.length),comp:pct(pass.filter(x=>x.completion).length,pass.length),adv:pct(p.filter(x=>x.num_advantage===true).length,p.length)}}
function group(p,key){return p.reduce((a,x)=>{const k=x[key]||"-";(a[k]??=[]).push(x);return a},{})}
const f=(v,d=2)=>v==null||Number.isNaN(v)?"-":Number(v).toFixed(d),fp=v=>v==null||Number.isNaN(v)?"-":Number(v).toFixed(1)+"%";
function table(rows){return`<div class=tw><table><thead><tr><th>Label</th><th>Plays</th><th>YPP</th><th>Med</th><th>1st %</th><th>EPA</th><th>Expl %</th><th>Neg %</th><th>Sack %</th><th>INT %</th><th>Scr %</th><th>Comp %</th><th>Adv %</th></tr></thead><tbody>`+rows.map(r=>`<tr><td>${r.label}</td><td>${r.plays}</td><td>${f(r.ypp)}</td><td>${f(r.median,1)}</td><td>${fp(r.first)}</td><td>${f(r.epa)}</td><td>${fp(r.expl)}</td><td>${fp(r.neg)}</td><td>${fp(r.sack)}</td><td>${fp(r.intr)}</td><td>${fp(r.scr)}</td><td>${fp(r.comp)}</td><td>${fp(r.adv)}</td></tr>`).join("")+"</tbody></table></div>"}
function cards(r){return`<div class=cards>${[["Plays",r.plays],["Yards/Play",f(r.ypp)],["Advantage Rate",fp(r.adv)],["First Down %",fp(r.first)],["Negative %",fp(r.neg)],["Completion %",fp(r.comp)]].map(x=>`<div class=metric><div class=mt>${x[0]}</div><div class=mv>${x[1]}</div></div>`).join("")}</div>`}

async function init(){
 const share=new URLSearchParams(location.search).get("share");
 if(share){await loadShared(share);return}
 const {data}=await sb.auth.getSession();session=data.session;
 renderRoot();
 sb.auth.onAuthStateChange((_e,s)=>{session=s;renderRoot()});
}
function renderRoot(){
 $("status").textContent=session?"Signed in":"Not signed in";
 show("auth",!session);show("projectsView",!!session&&!currentProject);show("dashboard",!!currentProject);show("signOut",!!session);
 if(session&&!currentProject)loadProjects();
}
$("sendLink").onclick=async()=>{
 $("authMsg").textContent="Sending...";
 const {error}=await sb.auth.signInWithOtp({email:$("email").value,options:{emailRedirectTo:location.origin}});
 $("authMsg").textContent=error?error.message:"Check your email for the sign-in link.";
};
$("signOut").onclick=()=>sb.auth.signOut();

async function loadProjects(){
 const {data,error}=await sb.from("projects").select("*").order("created_at",{ascending:false});
 if(error){$("projectMsg").textContent=error.message;return}
 $("projects").innerHTML=(data||[]).map(p=>`<div class=project><b>${p.name}</b><div class=note>${p.subject_team||"-"} · ${p.season||"-"} · ${p.project_type}</div><div class=actions><button onclick='openProject("${p.id}")'>Open</button><button onclick='togglePublish("${p.id}",${!p.published})'>${p.published?"Unpublish":"Publish"}</button>${p.published?`<button onclick='copyShare("${p.share_token}")'>Copy Coach Link</button>`:""}</div></div>`).join("");
}
window.togglePublish=async(id,published)=>{await sb.from("projects").update({published}).eq("id",id);loadProjects()}
window.copyShare=async token=>{await navigator.clipboard.writeText(location.origin+"/?share="+token);$("projectMsg").textContent="Coach link copied."}
window.openProject=async id=>{
 const {data:p}=await sb.from("projects").select("*").eq("id",id).single();
 const {data:pl,error}=await sb.from("plays").select("*").eq("project_id",id);
 if(error){alert(error.message);return}
 currentProject=p;plays=pl||[];renderDashboard();renderRoot();
}
$("back").onclick=()=>{currentProject=null;plays=[];renderRoot()}

$("createProject").onclick=async()=>{
 const file=$("pcsv").files[0];if(!$("pname").value||!file){$("projectMsg").textContent="Enter a project name and choose a CSV.";return}
 $("projectMsg").textContent="Creating project...";
 const {data:p,error}=await sb.from("projects").insert({name:$("pname").value,subject_team:$("pteam").value||null,season:Number($("pseason").value)||null,project_type:$("ptype").value}).select().single();
 if(error){$("projectMsg").textContent=error.message;return}
 const text=await file.text();const parsed=Papa.parse(text,{header:true,skipEmptyLines:true}).data;
 const rows=parsed.map((r,i)=>{
   const y=num(r.pff_GAINLOSSNET),d=num(r.pff_DOWN),dist=num(r.pff_DISTANCE),ytg=num(r.pff_YARDS_TO_GOAL_LINE),rp=String(r.pff_RUNPASS||"").toUpperCase(),pr=String(r.pff_PASSRESULT||"").toUpperCase();
   const comp=pr==="COMPLETE",sack=present(r.pff_SACK)||pr==="SACK",intr=present(r.pff_INTERCEPTION)||pr==="INTERCEPTION",fumble=present(r.pff_FUMBLE),inc=rp==="P"&&!comp&&!sack&&!intr;
   const fzg=String(r["FZ Advantage"]||"").toUpperCase(),fza=String(r["FZ Attacked"]||"").toUpperCase(),na=String(r["Num Ad"]||"").toUpperCase();
   return{skip:String(r.pff_NOPLAY||"0")==="1"||y===null||!["R","P"].includes(rp)||!String(r["Chart Formation"]||"").trim()||!["FIELD","BOUNDARY","BOX","MOF"].includes(fzg),
   project_id:p.id,source_play_id:String(r.pff_GAMEID||"")+"-"+String(r.pff_DRIVE||"")+"-"+String(r.pff_PLAYNUMBER||i+1),game_id:String(r.pff_GAMEID||"")||null,offense:school(r.pff_OFFTEAM),defense:school(r.pff_DEFTEAM),down:d,distance:dist,yards_to_goal:ytg,run_pass:rp,formation:String(r["Chart Formation"]||"").trim().toUpperCase(),personnel:String(r.pff_OFF_PERSONNEL_GROUP||"").replace(/\.0$/,"")||null,num_advantage:na==="YES"?true:na==="NO"?false:null,fz_advantage:fzg||null,fz_attacked:fza||null,same_zone:fzg!==""&&fzg===fza,yards:y,epa:num(r.pff_EXPECTED_POINTS_ADDED),first_down:Number(r.pff_FIRST_DOWN_GAINED||0)===1,touchdown:present(r.pff_TOUCHDOWN),explosive:y>=15,negative:(y<=0)||inc||sack||intr||fumble,completion:comp,sack,interception:intr,scramble:present(r.pff_QBSCRAMBLE),fumble,route:r.pff_ROUTE_THROWN||null,target_position:r.pff_PASSRECEIVERPOSITIONTARGET||null,pass_rushers:parseRushers(r.pff_PASSRUSHPLAYERS),down_distance_bucket:ddBucket(d,dist,ytg),distance_bucket:dist==null?"Unknown":dist<=3?"1-3":dist<=6?"4-6":dist<=9?"7-9":dist<=12?"10-12":"13+",raw_data:r}
 }).filter(x=>!x.skip).map(({skip,...x})=>x);
 $("projectMsg").textContent=`Uploading ${rows.length} plays...`;
 for(let i=0;i<rows.length;i+=500){const {error:e}=await sb.from("plays").insert(rows.slice(i,i+500));if(e){$("projectMsg").textContent=e.message;return}}
 $("projectMsg").textContent="Project saved.";loadProjects();
}

async function loadShared(token){
 $("status").textContent="Loading shared project...";
 const {data:p,error:e1}=await sb.rpc("get_shared_project",{token});
 const {data:pl,error:e2}=await sb.rpc("get_shared_plays",{token});
 if(e1||e2||!p?.length){$("status").textContent=e1?.message||e2?.message||"Shared project unavailable.";return}
 currentProject=p[0];plays=pl||[];renderDashboard();show("dashboard",true);show("auth",false);show("projectsView",false);
}
function renderDashboard(){
 $("projectTitle").textContent=currentProject.name;
 const tabs=["Dashboard","Offense","Defense","Team Comparison","Projected Totals","First Down Explorer","Field Zones","Routes","Situations"];
 $("tabs").innerHTML=tabs.map(t=>`<button class="${t===tab?"a":""}" onclick='setTab("${t}")'>${t}</button>`).join("");
 renderContent();
}
window.setTab=t=>{tab=t;renderDashboard()}
function renderContent(){
 const c=$("content"),o=sum("All",plays),off=Object.entries(group(plays,"offense")).map(([k,v])=>sum(k,v)).sort((a,b)=>b.plays-a.plays),def=Object.entries(group(plays,"defense")).map(([k,v])=>sum(k,v)).sort((a,b)=>b.plays-a.plays),forms=Object.entries(group(plays,"formation")).map(([k,v])=>sum(k,v)).sort((a,b)=>b.plays-a.plays);
 if(tab==="Dashboard")c.innerHTML=cards(o)+"<h3>Top Formations</h3>"+table(forms.slice(0,12));
 else if(tab==="Offense")c.innerHTML="<h3>Offensive Teams</h3>"+table(off)+"<h3>Formations</h3>"+table(forms.slice(0,20));
 else if(tab==="Defense")c.innerHTML="<h3>Defensive Production Allowed</h3>"+table(def);
 else if(tab==="Team Comparison")c.innerHTML="<h3>Offense</h3>"+table(off)+"<h3>Defense</h3>"+table(def);
 else if(tab==="Projected Totals"){const a=sum("A",plays.filter(x=>x.num_advantage===true)),n=sum("N",plays.filter(x=>x.num_advantage===false)),r=.7,m=k=>(a[k]||0)*r+(n[k]||0)*(1-r),row={label:"70% Advantage",plays:plays.length,ypp:m("ypp"),median:m("median"),first:m("first"),epa:m("epa"),expl:m("expl"),neg:m("neg"),sack:m("sack"),intr:m("intr"),scr:m("scr"),comp:m("comp"),adv:70};c.innerHTML=cards(row)+table([row])}
 else if(tab==="First Down Explorer"){const p=plays.filter(x=>x.first_down),byF=Object.entries(group(p,"formation")).map(([k,v])=>sum(k,v)).sort((a,b)=>b.plays-a.plays),byD=Object.entries(group(p,"down_distance_bucket")).map(([k,v])=>sum(k,v)).sort((a,b)=>b.plays-a.plays);c.innerHTML=cards(sum("First Downs",p))+"<h3>By Formation</h3>"+table(byF)+"<h3>By Down-Distance</h3>"+table(byD)}
 else if(tab==="Field Zones")c.innerHTML="<h3>FZ Advantage</h3>"+table(Object.entries(group(plays,"fz_advantage")).map(([k,v])=>sum(k,v)))+"<h3>FZ Attacked</h3>"+table(Object.entries(group(plays,"fz_attacked")).map(([k,v])=>sum(k,v)));
 else if(tab==="Routes")c.innerHTML=table(Object.entries(group(plays.filter(x=>x.route),"route")).map(([k,v])=>sum(k,v)).filter(x=>x.plays>=2).sort((a,b)=>b.plays-a.plays));
 else c.innerHTML=table(Object.entries(group(plays.filter(x=>x.down_distance_bucket!=="Unknown"),"down_distance_bucket")).map(([k,v])=>sum(k,v)).filter(x=>x.plays>=5));
}
init();
</script>
</body></html>
