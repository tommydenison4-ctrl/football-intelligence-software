<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ULM Football Analytics</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
:root{--m:#6b0016;--n:#0b1f3a;--g:#b9975b;--bg:#f4f6f9;--p:#fff;--l:#d9dee7;--t:#172033;--u:#687287}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--t)}
button,input,select{font:inherit}
header{background:linear-gradient(135deg,var(--m),#2c0008);color:white;padding:22px 28px;border-bottom:5px solid var(--g);display:flex;justify-content:space-between;align-items:center;gap:18px}
h1{margin:3px 0}.ey{color:var(--g);font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
main{padding:22px 28px}.panel,.auth,.project{background:white;border:1px solid var(--l);border-radius:14px;padding:18px}
.auth{width:min(440px,90vw);margin:70px auto}.auth input,.form input,.form select{width:100%;padding:10px;border:1px solid var(--l);border-radius:8px;margin:5px 0 11px}
button{background:var(--m);color:white;border:0;border-radius:8px;padding:10px 13px;font-weight:800;cursor:pointer}
.note{color:var(--u);font-size:13px;margin-top:8px}.hide{display:none}
.status{padding:10px 28px;background:white;border-bottom:1px solid var(--l);color:var(--u);font-size:13px;font-weight:700;display:flex;gap:18px;flex-wrap:wrap}
.form-grid,.filters,.subfilters{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:10px}
.form-grid label,.filters label,.subfilters label{font-size:11px;color:var(--u);font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.form-grid input,.form-grid select,.filters select,.subfilters select{width:100%;margin-top:5px;padding:9px;border:1px solid var(--l);border-radius:8px;background:#fff}
.filters{padding:16px 28px;background:#fbfcfe;border-bottom:1px solid var(--l)}
.tabs{display:flex;gap:7px;flex-wrap:wrap;padding:14px 28px 0}.tabs button{background:white;color:var(--u);border:1px solid var(--l);border-radius:9px 9px 0 0}.tabs button.a{background:var(--n);color:white;border-color:var(--n)}
.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:11px;margin-bottom:18px}
.metric{background:white;border:1px solid var(--l);border-top:4px solid var(--g);border-radius:12px;padding:14px}.mt{font-size:11px;color:var(--u);font-weight:900;text-transform:uppercase}.mv{font-size:26px;color:var(--m);font-weight:900;margin-top:5px}.ms{font-size:12px;color:var(--u);margin-top:3px}
.tw{overflow:auto;background:white;border:1px solid var(--l);border-radius:12px}table{width:100%;border-collapse:collapse;font-size:12px}th{background:var(--m);color:white;text-align:left;padding:8px;white-space:nowrap}td{padding:8px;border-top:1px solid var(--l);white-space:nowrap}tr:nth-child(even)td{background:#fafbfe}
.projects{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.barrow{display:grid;grid-template-columns:130px 1fr 60px;gap:8px;align-items:center;margin:7px 0}.barbg{height:20px;background:#edf0f5;border-radius:5px;overflow:hidden}.bar{height:100%;background:var(--m)}.bar.n{background:var(--n)}.bar.g{background:var(--g)}
.slider{display:grid;grid-template-columns:230px 1fr 70px;gap:12px;align-items:center}.slider input{width:100%}.slider input[type="range"]{accent-color:var(--m);cursor:pointer}
.matrix td{white-space:normal;vertical-align:top}.matrix td span{display:block;color:var(--u);margin-top:3px}.rowlabel{font-weight:900;color:var(--n)}
@media(max-width:1100px){.form-grid,.filters,.subfilters{grid-template-columns:repeat(3,1fr)}.cards{grid-template-columns:repeat(3,1fr)}.projects{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}
@media(max-width:700px){
.form-grid,.filters,.subfilters{grid-template-columns:1fr 1fr}
.cards{grid-template-columns:1fr 1fr}
.projects{grid-template-columns:1fr}
.slider{grid-template-columns:1fr;gap:10px;align-items:stretch}
.slider input[type="range"]{display:block;width:100%;min-width:0;height:44px;margin:0;touch-action:pan-x}
.slider strong{font-size:22px;color:var(--m)}
}
</style>
</head>
<body>
<header>
<div><div class="ey">ULM Football</div><h1>Football Analytics Platform</h1><div>Supabase-connected dashboard</div></div>
<button id="signOut" class="hide">Sign out</button>
</header>

<div id="status" class="status"><span>Loading...</span></div>

<main id="rootMain">
<section id="auth" class="auth hide">
<h2>Owner Sign-In</h2>
<input id="email" type="email" placeholder="Email address">
<button id="sendLink">Email me a sign-in link</button>
<div id="authMsg" class="note"></div>
</section>

<section id="projectsView" class="hide">
<div class="panel form">
<h2>Create Project</h2>
<div class="form-grid">
<label>Project name<input id="pname"></label>
<label>Subject team<input id="pteam"></label>
<label>Season<input id="pseason" type="number" value="2026"></label>
<label>Project type<select id="ptype"><option value="opponent">Opponent</option><option value="league">League Database</option><option value="self_scout">ULM Self Scout</option></select></label>
<label>CSV<input id="pcsv" type="file" accept=".csv"></label>
</div>
<button id="createProject">Create and Import</button>
<div id="projectMsg" class="note"></div>
</div>
<h2>Projects</h2>
<div id="projects" class="projects"></div>
</section>

<section id="dashboard" class="hide"></section>
</main>

<script>
const SUPABASE_URL="https://hzrosmevuejjlxigdxmg.supabase.co";
const SUPABASE_KEY="sb_publishable_FtmUeN1QkLlkRIqCIdQ5gw_KDbEFy1H";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const TEAM={ALBI:"UAB",CTUN:"Connecticut",FLAT:"Florida Atlantic",FLIN:"Florida International",FLSO:"South Florida",LATU:"Tulane",MDNA:"Navy",MDUN:"Maryland",NCEA:"East Carolina",OKTU:"Tulsa",TNMS:"Memphis",TXRI:"Rice"};

let session=null,currentProject=null,plays=[],filtered=[],tab="Dashboard",readOnly=false,projectionRate=70;
let filters={offense:"All",defense:"All",formation:"All",personnel:"All",advantage:"All",fzGiven:"All",fzAttacked:"All",downDistance:"All",runPass:"All",route:"All",rushers:"All"};
let fdFilters={downDistance:"All",advantage:"All",runPass:"All",formation:"All",offense:"All",defense:"All"};

const $=id=>document.getElementById(id), show=(id,on=true)=>$(id).classList.toggle("hide",!on);
const num=v=>Number.isFinite(Number(v))?Number(v):null;
const present=v=>v!==undefined&&v!==null&&String(v).trim()!==""&&String(v).trim().toUpperCase()!=="NAN";
const school=v=>TEAM[String(v||"").trim().toUpperCase()]||String(v||"").trim().toUpperCase();
const f=(v,d=2)=>v==null||Number.isNaN(v)?"-":Number(v).toFixed(d);
const fp=v=>v==null||Number.isNaN(v)?"-":Number(v).toFixed(1)+"%";

function ddBucket(d,dist,ytg){
 if(!d||dist===null)return"Unknown";
 if(ytg!==null&&Math.round(ytg)===Math.round(dist))return d+" & Goal";
 if(d===1)return Math.abs(dist-10)<.01?"1st & 10":dist>=15?"1st & 15+":"1st & Other";
 let b=dist<=3?"1-3":dist<=6?"4-6":dist<=9?"7-9":dist<=12?"10-12":"13+";
 return(d===2?"2nd":d===3?"3rd":"4th")+" & "+b;
}
function parseRushers(v){const m=String(v||"").match(/^\s*(\d+)/);return m?Number(m[1]):null}
function avg(a){a=a.filter(Number.isFinite);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null}
function med(a){a=a.filter(Number.isFinite).sort((x,y)=>x-y);if(!a.length)return null;let m=Math.floor(a.length/2);return a.length%2?a[m]:(a[m-1]+a[m])/2}
function pct(n,d){return d?100*n/d:null}
function sum(label,p){
 const pass=p.filter(x=>x.run_pass==="P");
 return{label,plays:p.length,ypp:avg(p.map(x=>Number(x.yards))),median:med(p.map(x=>Number(x.yards))),first:pct(p.filter(x=>x.first_down).length,p.length),epa:avg(p.map(x=>Number(x.epa))),expl:pct(p.filter(x=>x.explosive).length,p.length),neg:pct(p.filter(x=>x.negative).length,p.length),sack:pct(pass.filter(x=>x.sack).length,pass.length),intr:pct(pass.filter(x=>x.interception).length,pass.length),scr:pct(pass.filter(x=>x.scramble).length,pass.length),comp:pct(pass.filter(x=>x.completion).length,pass.length),adv:pct(p.filter(x=>x.num_advantage===true).length,p.length),td:pct(p.filter(x=>x.touchdown).length,p.length)}
}
function group(p,key){return p.reduce((a,x)=>{const k=x[key]||"-";(a[k]??=[]).push(x);return a},{})}
function metricRows(p,key,min=1){return Object.entries(group(p,key)).map(([k,v])=>sum(k,v)).filter(r=>r.plays>=min)}
function table(rows){return`<div class=tw><table><thead><tr><th>Label</th><th>Plays</th><th>YPP</th><th>Med</th><th>1st %</th><th>EPA</th><th>Expl %</th><th>Neg %</th><th>Sack %</th><th>INT %</th><th>Scr %</th><th>Comp %</th><th>Adv %</th></tr></thead><tbody>`+rows.map(r=>`<tr><td>${r.label}</td><td>${r.plays}</td><td>${f(r.ypp)}</td><td>${f(r.median,1)}</td><td>${fp(r.first)}</td><td>${f(r.epa)}</td><td>${fp(r.expl)}</td><td>${fp(r.neg)}</td><td>${fp(r.sack)}</td><td>${fp(r.intr)}</td><td>${fp(r.scr)}</td><td>${fp(r.comp)}</td><td>${fp(r.adv)}</td></tr>`).join("")+"</tbody></table></div>"}
function cards(r){return`<div class=cards>${[["Plays",r.plays,""],["Yards / Play",f(r.ypp),"Median "+f(r.median,1)],["Advantage Rate",fp(r.adv),""],["First Down %",fp(r.first),""],["Negative %",fp(r.neg),""],["Completion %",fp(r.comp),""]].map(x=>`<div class=metric><div class=mt>${x[0]}</div><div class=mv>${x[1]}</div>${x[2]?`<div class=ms>${x[2]}</div>`:""}</div>`).join("")}</div>`}
function bars(rows,key,title,cls=""){const mx=Math.max(...rows.map(r=>r[key]||0),1);return`<div class=panel><h3>${title}</h3>`+rows.slice(0,12).map(r=>`<div class=barrow><span>${r.label}</span><div class=barbg><div class="bar ${cls}" style="width:${100*(r[key]||0)/mx}%"></div></div><b>${f(r[key],1)}</b></div>`).join("")+"</div>"}
function opts(arr){return["All",...Array.from(new Set(arr.filter(v=>v!==null&&v!==undefined&&String(v)!=="").map(String))).sort()]}
function selectHtml(label,key,values,stateName){
 const state=stateName==="fd"?fdFilters:filters;
 return`<label>${label}<select data-state="${stateName}" data-key="${key}">${values.map(v=>`<option ${state[key]===v?"selected":""}>${v}</option>`).join("")}</select></label>`;
}
function attachSelectHandlers(){
 document.querySelectorAll("select[data-state]").forEach(s=>s.onchange=e=>{
   const state=e.target.dataset.state,key=e.target.dataset.key,val=e.target.value;
   if(state==="fd")fdFilters[key]=val;else filters[key]=val;
   if(state==="fd")renderContent();else applyFilters();
 });
}

async function init(){
 const share=new URLSearchParams(location.search).get("share");
 if(share){await loadShared(share);return}
 const {data}=await sb.auth.getSession();session=data.session;
 sb.auth.onAuthStateChange((_e,s)=>{session=s;renderRoot()});
 renderRoot();
}
function renderRoot(){
 $("status").innerHTML=session?`<span>Signed in</span>`:`<span>Not signed in</span>`;
 show("auth",!session&&!readOnly);show("projectsView",!!session&&!currentProject&&!readOnly);show("dashboard",!!currentProject);show("signOut",!!session&&!readOnly);
 if(session&&!currentProject&&!readOnly)loadProjects();
}
$("sendLink").onclick=async()=>{
 $("authMsg").textContent="Sending...";
 const {error}=await sb.auth.signInWithOtp({email:$("email").value,options:{emailRedirectTo:location.origin}});
 $("authMsg").textContent=error?error.message:"Check your email for the sign-in link.";
};
$("signOut").onclick=()=>sb.auth.signOut();

async function loadProjects(){
 const {data,error}=await sb.from("projects").select("*").order("created_at",{ascending:false});
 if(error){$("projectMsg").textContent=error.message;return}
 $("projects").innerHTML=(data||[]).map(p=>`<div class=project><b>${p.name}</b><div class=note>${p.subject_team||"-"} · ${p.season||"-"} · ${p.project_type}</div><div class=actions><button onclick='openProject("${p.id}")'>Open</button><button onclick='togglePublish("${p.id}",${!p.published})'>${p.published?"Unpublish":"Publish"}</button>${p.published?`<button onclick='copyShare("${p.share_token}")'>Copy Coach Link</button>`:""}</div></div>`).join("");
}
window.togglePublish=async(id,published)=>{await sb.from("projects").update({published}).eq("id",id);loadProjects()}
window.copyShare=async token=>{await navigator.clipboard.writeText(location.origin+"/?share="+token);$("projectMsg").textContent="Coach link copied."}
window.openProject=async id=>{
 const {data:p}=await sb.from("projects").select("*").eq("id",id).single();
 const {data:pl,error}=await sb.from("plays").select("*").eq("project_id",id);
 if(error){alert(error.message);return}
 currentProject=p;plays=pl||[];filtered=[...plays];readOnly=false;resetFilters();renderDashboard();renderRoot();
}

$("createProject").onclick=async()=>{
 const file=$("pcsv").files[0];if(!$("pname").value||!file){$("projectMsg").textContent="Enter a project name and choose a CSV.";return}
 $("projectMsg").textContent="Creating project...";
 const {data:p,error}=await sb.from("projects").insert({name:$("pname").value,subject_team:$("pteam").value||null,season:Number($("pseason").value)||null,project_type:$("ptype").value}).select().single();
 if(error){$("projectMsg").textContent=error.message;return}
 const text=await file.text();const parsed=Papa.parse(text,{header:true,skipEmptyLines:true}).data;
 const rows=parsed.map((r,i)=>{
   const y=num(r.pff_GAINLOSSNET),d=num(r.pff_DOWN),dist=num(r.pff_DISTANCE),ytg=num(r.pff_YARDS_TO_GOAL_LINE),rp=String(r.pff_RUNPASS||"").toUpperCase(),pr=String(r.pff_PASSRESULT||"").toUpperCase();
   const comp=pr==="COMPLETE",sack=present(r.pff_SACK)||pr==="SACK",intr=present(r.pff_INTERCEPTION)||pr==="INTERCEPTION",fumble=present(r.pff_FUMBLE),inc=rp==="P"&&!comp&&!sack&&!intr;
   const fzg=String(r["FZ Advantage"]||"").toUpperCase(),fza=String(r["FZ Attacked"]||"").toUpperCase(),na=String(r["Num Ad"]||"").toUpperCase();
   return{skip:String(r.pff_NOPLAY||"0")==="1"||y===null||!["R","P"].includes(rp)||!String(r["Chart Formation"]||"").trim()||!["FIELD","BOUNDARY","BOX","MOF"].includes(fzg),
   project_id:p.id,source_play_id:String(r.pff_GAMEID||"")+"-"+String(r.pff_DRIVE||"")+"-"+String(r.pff_PLAYNUMBER||i+1),game_id:String(r.pff_GAMEID||"")||null,offense:school(r.pff_OFFTEAM),defense:school(r.pff_DEFTEAM),down:d,distance:dist,yards_to_goal:ytg,run_pass:rp,formation:String(r["Chart Formation"]||"").trim().toUpperCase(),personnel:String(r.pff_OFF_PERSONNEL_GROUP||"").replace(/\.0$/,"")||null,num_advantage:na==="YES"?true:na==="NO"?false:null,fz_advantage:fzg||null,fz_attacked:fza||null,same_zone:fzg!==""&&fzg===fza,yards:y,epa:num(r.pff_EXPECTED_POINTS_ADDED),first_down:Number(r.pff_FIRST_DOWN_GAINED||0)===1,touchdown:present(r.pff_TOUCHDOWN),explosive:y>=15,negative:(y<=0)||inc||sack||intr||fumble,completion:comp,sack,interception:intr,scramble:present(r.pff_QBSCRAMBLE),fumble,route:r.pff_ROUTE_THROWN||null,target_position:r.pff_PASSRECEIVERPOSITIONTARGET||null,pass_rushers:parseRushers(r.pff_PASSRUSHPLAYERS),down_distance_bucket:ddBucket(d,dist,ytg),distance_bucket:dist==null?"Unknown":dist<=3?"1-3":dist<=6?"4-6":dist<=9?"7-9":dist<=12?"10-12":"13+",raw_data:r}
 }).filter(x=>!x.skip).map(({skip,...x})=>x);
 $("projectMsg").textContent=`Uploading ${rows.length} plays...`;
 for(let i=0;i<rows.length;i+=500){const {error:e}=await sb.from("plays").insert(rows.slice(i,i+500));if(e){$("projectMsg").textContent=e.message;return}}
 $("projectMsg").textContent="Project saved.";loadProjects();
}

async function loadShared(token){
 $("status").innerHTML="<span>Loading shared project...</span>";
 const {data:p,error:e1}=await sb.rpc("get_shared_project",{token});
 const {data:pl,error:e2}=await sb.rpc("get_shared_plays",{token});
 if(e1||e2||!p?.length){$("status").innerHTML=`<span>${e1?.message||e2?.message||"Shared project unavailable."}</span>`;return}
 currentProject=p[0];plays=pl||[];filtered=[...plays];readOnly=true;resetFilters();renderDashboard();show("dashboard",true);show("auth",false);show("projectsView",false);show("signOut",false);
}
function resetFilters(){
 filters={offense:"All",defense:"All",formation:"All",personnel:"All",advantage:"All",fzGiven:"All",fzAttacked:"All",downDistance:"All",runPass:"All",route:"All",rushers:"All"};
 fdFilters={downDistance:"All",advantage:"All",runPass:"All",formation:"All",offense:"All",defense:"All"};
 projectionRate=70;
}
function renderDashboard(){
 $("dashboard").innerHTML=`
 <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
   <div><h2 style="margin-bottom:3px">${currentProject.name}</h2><div class=note>${currentProject.subject_team||"-"} · ${currentProject.season||"-"}</div></div>
   ${readOnly?"":"<button id='backBtn'>Back to Projects</button>"}
 </div>
 <div id="globalFilters" class="filters"></div>
 <div id="tabs" class="tabs"></div>
 <div id="content"></div>`;
 if(!readOnly)$("backBtn").onclick=()=>{currentProject=null;plays=[];filtered=[];renderRoot()}
 buildGlobalFilters();buildTabs();applyFilters();
}
function buildGlobalFilters(){
 const fz=["All","FIELD","BOUNDARY","BOX","MOF"];
 $("globalFilters").innerHTML=
 selectHtml("Offense","offense",opts(plays.map(x=>x.offense)),"global")+
 selectHtml("Defense","defense",opts(plays.map(x=>x.defense)),"global")+
 selectHtml("Formation","formation",opts(plays.map(x=>x.formation)),"global")+
 selectHtml("Personnel","personnel",opts(plays.map(x=>x.personnel)),"global")+
 selectHtml("Advantage","advantage",["All","Advantaged","Non-Advantaged"],"global")+
 selectHtml("FZ Given","fzGiven",fz,"global")+
 selectHtml("FZ Attacked","fzAttacked",fz,"global")+
 selectHtml("Down-Distance","downDistance",opts(plays.map(x=>x.down_distance_bucket)),"global")+
 selectHtml("Run / Pass","runPass",["All","R","P"],"global")+
 selectHtml("Route","route",opts(plays.map(x=>x.route)),"global")+
 selectHtml("Rushers","rushers",opts(plays.map(x=>x.pass_rushers)),"global");
 attachSelectHandlers();
}
function buildTabs(){
 const tabs=["Dashboard","Offense","Defense","Team Comparison","Projected Totals","First Down Explorer","Field Zones","Routes","Situations"];
 $("tabs").innerHTML=tabs.map(t=>`<button class="${t===tab?"a":""}" onclick='setTab(${JSON.stringify(t)})'>${t}</button>`).join("");
}
window.setTab=t=>{tab=t;buildTabs();renderContent()}

function applyFilters(){
 filtered=plays.filter(p=>
  (filters.offense==="All"||p.offense===filters.offense)&&
  (filters.defense==="All"||p.defense===filters.defense)&&
  (filters.formation==="All"||p.formation===filters.formation)&&
  (filters.personnel==="All"||String(p.personnel)===filters.personnel)&&
  (filters.advantage==="All"||(filters.advantage==="Advantaged"?p.num_advantage===true:p.num_advantage===false))&&
  (filters.fzGiven==="All"||p.fz_advantage===filters.fzGiven)&&
  (filters.fzAttacked==="All"||p.fz_attacked===filters.fzAttacked)&&
  (filters.downDistance==="All"||p.down_distance_bucket===filters.downDistance)&&
  (filters.runPass==="All"||p.run_pass===filters.runPass)&&
  (filters.route==="All"||String(p.route||"")===filters.route)&&
  (filters.rushers==="All"||String(p.pass_rushers||"")===filters.rushers)
 );
 $("status").innerHTML=`<span>${plays.length} plays loaded</span><span>${filtered.length} after filters</span><span>${new Set(plays.map(x=>x.offense)).size} offenses</span><span>${new Set(plays.map(x=>x.defense)).size} defenses</span>`;
 renderContent();
}
function renderContent(){
 const c=$("content"),overall=sum("Filtered",filtered);
 const advRows=[sum("Advantaged",filtered.filter(x=>x.num_advantage===true)),sum("Non-Advantaged",filtered.filter(x=>x.num_advantage===false))];
 const offenseRows=metricRows(filtered,"offense").sort((a,b)=>b.plays-a.plays);
 const defenseRows=metricRows(filtered,"defense").sort((a,b)=>b.plays-a.plays);
 const formRows=metricRows(filtered,"formation").sort((a,b)=>b.plays-a.plays);
 const efficient=[...formRows].filter(r=>r.plays>=10).sort((a,b)=>(b.ypp??-999)-(a.ypp??-999)).slice(0,12);

 if(tab==="Dashboard"){
   c.innerHTML=cards(overall)+`<div class=two>${bars(advRows,"ypp","Advantage Split: YPP")}${bars(efficient,"ypp","Formation Efficiency","g")}</div>`;
 }
 else if(tab==="Offense"){
   c.innerHTML="<h2>Offensive Profile</h2>"+table(offenseRows)+"<h2>Formations</h2>"+table(formRows.slice(0,20));
 }
 else if(tab==="Defense"){
   c.innerHTML="<h2>Defensive Profile</h2><p class=note>Metrics show production allowed. Negative % is negative plays forced.</p>"+table(defenseRows)+`<div class=two>${bars(defenseRows,"ypp","YPP Allowed")}${bars(defenseRows,"neg","Negative Plays Forced","n")}</div>`;
 }
 else if(tab==="Team Comparison"){
   c.innerHTML=`<h2>Team Comparison</h2><div class=two><div><h3>Offensive Production</h3>${table(offenseRows)}</div><div><h3>Defensive Production Allowed</h3>${table(defenseRows)}</div></div>`;
 }
 else if(tab==="Projected Totals"){
   const adv=advRows[0],non=advRows[1],r=projectionRate/100,m=k=>(adv[k]??0)*r+(non[k]??0)*(1-r);
   const row={label:projectionRate+"% Advantage",plays:filtered.length,ypp:m("ypp"),median:m("median"),first:m("first"),epa:m("epa"),expl:m("expl"),neg:m("neg"),sack:m("sack"),intr:m("intr"),scr:m("scr"),comp:m("comp"),adv:projectionRate,td:m("td")};
   const totalPlays=70,projYards=(row.ypp??0)*totalPlays,projFD=(row.first??0)/100*totalPlays,projExpl=(row.expl??0)/100*totalPlays,projNeg=(row.neg??0)/100*totalPlays,projPoints=(row.td??0)/100*totalPlays*7;
   c.innerHTML=`<h2>Projected Totals</h2><div class=panel><div class=slider><b>Advantage Execution Rate</b><input id="projSlider" type="range" min="0" max="100" value="${projectionRate}"><strong>${projectionRate}%</strong></div><p class=note>Uses actual advantaged and non-advantaged production from the current filtered sample. Game estimate assumes 70 plays.</p></div>
   <div class=cards>
   <div class=metric><div class=mt>Projected YPP</div><div class=mv>${f(row.ypp)}</div></div>
   <div class=metric><div class=mt>Projected Yards</div><div class=mv>${f(projYards,0)}</div></div>
   <div class=metric><div class=mt>Projected First Downs</div><div class=mv>${f(projFD,1)}</div></div>
   <div class=metric><div class=mt>Projected Explosives</div><div class=mv>${f(projExpl,1)}</div></div>
   <div class=metric><div class=mt>Projected Negatives</div><div class=mv>${f(projNeg,1)}</div></div>
   <div class=metric><div class=mt>Projected Points</div><div class=mv>${f(projPoints,1)}</div></div></div>
   ${table([row])}`;
   $("projSlider").oninput=e=>{projectionRate=Number(e.target.value);renderContent()}
 }
 else if(tab==="First Down Explorer"){
   const fd=filtered.filter(x=>x.first_down)
    .filter(x=>fdFilters.downDistance==="All"||x.down_distance_bucket===fdFilters.downDistance)
    .filter(x=>fdFilters.advantage==="All"||(fdFilters.advantage==="Advantaged"?x.num_advantage===true:x.num_advantage===false))
    .filter(x=>fdFilters.runPass==="All"||x.run_pass===fdFilters.runPass)
    .filter(x=>fdFilters.formation==="All"||x.formation===fdFilters.formation)
    .filter(x=>fdFilters.offense==="All"||x.offense===fdFilters.offense)
    .filter(x=>fdFilters.defense==="All"||x.defense===fdFilters.defense);
   c.innerHTML=`<h2>First Down Explorer</h2><p class=note>Only plays that gained a first down are loaded in this view.</p><div class=subfilters>
   ${selectHtml("Down-Distance","downDistance",opts(filtered.map(x=>x.down_distance_bucket)),"fd")}
   ${selectHtml("Advantage","advantage",["All","Advantaged","Non-Advantaged"],"fd")}
   ${selectHtml("Run / Pass","runPass",["All","R","P"],"fd")}
   ${selectHtml("Formation","formation",opts(filtered.map(x=>x.formation)),"fd")}
   ${selectHtml("Offense","offense",opts(filtered.map(x=>x.offense)),"fd")}
   ${selectHtml("Defense","defense",opts(filtered.map(x=>x.defense)),"fd")}
   </div>${cards(sum("First Downs",fd))}
   <div class=two><div><h3>First Downs by Formation</h3>${table(metricRows(fd,"formation").sort((a,b)=>b.plays-a.plays))}</div><div><h3>First Downs by Down-Distance</h3>${table(metricRows(fd,"down_distance_bucket").sort((a,b)=>b.plays-a.plays))}</div></div>`;
   attachSelectHandlers();
 }
 else if(tab==="Field Zones"){
   const form=filters.formation!=="All"?filters.formation:(formRows[0]?.label||"");
   const z=["FIELD","BOUNDARY","BOX"],p=filtered.filter(x=>x.formation===form);
   const body=z.map(g=>`<tr><td class=rowlabel>${g}</td>`+z.map(a=>{const r=sum(a,p.filter(x=>x.fz_advantage===g&&x.fz_attacked===a));return`<td><b>${f(r.ypp,1)} YPP</b><span>Med ${f(r.median,1)}</span><span>${fp(r.first)} 1st</span><span>${fp(r.neg)} neg</span><span>n=${r.plays}</span></td>`}).join("")+"</tr>").join("");
   c.innerHTML=`<h2>FZ Given x FZ Attacked — ${form||"No formation"}</h2><div class=tw><table class=matrix><thead><tr><th>FZ Given</th><th>Attack Field</th><th>Attack Boundary</th><th>Attack Box</th></tr></thead><tbody>${body}</tbody></table></div>`;
 }
 else if(tab==="Routes"){
   c.innerHTML="<h2>Routes</h2>"+table(metricRows(filtered.filter(x=>x.run_pass==="P"&&x.route),"route",2).sort((a,b)=>b.plays-a.plays).slice(0,40));
 }
 else if(tab==="Situations"){
   c.innerHTML="<h2>Situations</h2>"+table(metricRows(filtered.filter(x=>x.down_distance_bucket!=="Unknown"&&x.down_distance_bucket!=="1st & Other"),"down_distance_bucket",5));
 }
}
init();
</script>
</body>
</html>
