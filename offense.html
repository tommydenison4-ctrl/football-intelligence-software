<script>

const TEAM={"ALBI":"UAB","UAB":"UAB","OKST":"Oklahoma State","OKSU":"Oklahoma State","FLAT":"Florida Atlantic","FAU":"Florida Atlantic","MDUN":"Maryland","CTUN":"Connecticut","FLSO":"South Florida","FLIN":"Florida International","LATU":"Tulane","MDNA":"Navy","NCEA":"East Carolina","OKTU":"Tulsa","TNMS":"Memphis","TXRI":"Rice","USA":"South Alabama","SALA":"South Alabama","ULM":"ULM","LAMO":"ULM","TENN":"Tennessee","UTM":"UT Martin","TXST":"Texas State","USM":"Southern Miss","MEMP":"Memphis","PURD":"Purdue","UGA":"Georgia","WVU":"West Virginia","BYU":"BYU"};
function cleanDisplay(v){ if(v===null||v===undefined)return ""; const raw=String(v).trim(); const noDecimal=/^-?\d+\.0$/.test(raw)?raw.slice(0,-2):raw; return TEAM[noDecimal.toUpperCase()]||noDecimal;}


let session={public:true},currentProject=null,plays=[],filtered=[],tab="Dashboard",readOnly=true,projectionRate=70;
let filters={offense:"All",defense:"All",formation:"All",personnel:"All",advantage:"All",fzGiven:"All",fzAttacked:"All",downDistance:"All",runPass:"All",route:"All",rushers:"All"};
let fdFilters={downDistance:"All",advantage:"All",runPass:"All",formation:"All",offense:"All",defense:"All"};

const $=id=>document.getElementById(id), show=(id,on=true)=>$(id).classList.toggle("hide",!on);
const num=v=>Number.isFinite(Number(v))?Number(v):null;
const present=v=>v!==undefined&&v!==null&&String(v).trim()!==""&&String(v).trim().toUpperCase()!=="NAN";
const school=v=>TEAM[String(v||"").trim().toUpperCase()]||String(v||"").trim().toUpperCase();
const f=(v,d=2)=>v==null||Number.isNaN(v)?"-":Number(v).toFixed(d);
const fp=v=>v==null||Number.isNaN(v)?"-":Number(v).toFixed(1)+"%";

function ddBucket(d,dist,ytg){
 if(!d||dist===null)return"Unknown";
 if(ytg!==null&&Math.round(ytg)===Math.round(dist))return d+" & Goal";
 if(d===1)return Math.abs(dist-10)<.01?"1st & 10":dist>=15?"1st & 15+":"1st & Other";
 let b=dist<=3?"1-3":dist<=6?"4-6":dist<=9?"7-9":dist<=12?"10-12":"13+";
 return(d===2?"2nd":d===3?"3rd":"4th")+" & "+b;
}

function truthy(v){return v===true||v===1||String(v||"").trim().toLowerCase()==="true"||String(v||"").trim()==="1"}
function textHas(p,pattern){
 const text=[p.play_description,p.description,p.play_text,p.play_result,p.result,p.penalty_type,p.penalty].filter(Boolean).join(" ").toLowerCase();
 return pattern.test(text);
}
function isScramble(p){return truthy(p.scramble)||textHas(p,/\bscramble\b/)}
function isSack(p){return truthy(p.sack)||textHas(p,/\bsack(ed)?\b/)}
function isInterception(p){return truthy(p.interception)||textHas(p,/\bintercept(ed|ion)?\b/)}
function isCompletedPass(p){return truthy(p.completion)||textHas(p,/\bcomplete(d)?\b/)&&!textHas(p,/\bincomplete\b/)}
function isPenaltyFirstDown(p){
 return truthy(p.penalty_first_down)||truthy(p.first_down_by_penalty)||truthy(p.automatic_first_down)||
  (truthy(p.first_down)&&textHas(p,/\b(pass interference|defensive holding|roughing|personal foul|facemask|face mask|automatic first down|penalty)\b/));
}
function isTruePassAttempt(p){
 if(p.run_pass!=="P"||isSack(p)||isScramble(p))return false;
 return isCompletedPass(p)||isInterception(p)||truthy(p.incompletion)||
  textHas(p,/\bincomplete\b|\bpass\b/)||present(p.route);
}
function possessionKey(p){
 return p.possession_id??p.drive_id??p.drive_number??p.drive??p.series_id??p.possession_number??null;
}
function explicitPossessionStart(p){
 return truthy(p.is_first_play_of_possession)||truthy(p.possession_start)||truthy(p.drive_start)||
  Number(p.play_in_drive)===1||Number(p.drive_play_number)===1||Number(p.possession_play_number)===1;
}
function endOfPossessionEvent(p){
 return truthy(p.turnover)||truthy(p.change_of_possession)||truthy(p.punt)||
  truthy(p.touchdown)||truthy(p.safety)||truthy(p.end_of_half)||truthy(p.end_of_game)||
  isInterception(p)||truthy(p.fumble_lost)||
  textHas(p,/\bpunt(ed)?\b|\btouchdown\b|\bintercept(ed|ion)?\b|\bfumble.*lost\b|\bturnover on downs\b|\bend of (half|game|quarter)\b|\bsafety\b/);
}
function sameGameAs(a,b){
 if(!a||!b)return false;
 if(!present(a.game_id)||!present(b.game_id))return true;
 return String(a.game_id)===String(b.game_id);
}
function offenseChanged(prev,p){
 if(!prev||!present(prev.offense)||!present(p.offense))return false;
 return String(prev.offense)!==String(p.offense);
}
function sequenceNumber(p){
 for(const key of ["play_number","play_id","source_play_id","sequence","play_sequence"]){
  const v=p[key];
  const m=String(v??"").match(/(\d+)(?!.*\d)/);
  if(m)return Number(m[1]);
 }
 return null;
}
function enrichPlays(rows){
 const enriched=[];
 (rows||[]).forEach((p,i,a)=>{
  const down=Number(p.down),dist=Number(p.distance),ytg=num(p.yards_to_goal);
  const prev=i?a[i-1]:null;
  const currentKey=possessionKey(p),prevKey=prev?possessionKey(prev):null;
  const gameChanged=!!prev&&!sameGameAs(prev,p);
  const keyStart=currentKey!==null&&(!prev||gameChanged||String(currentKey)!==String(prevKey));
  const firstGamePlay=!prev||gameChanged;
  const offenseFlip=!!prev&&sameGameAs(prev,p)&&offenseChanged(prev,p);
  const followsPossessionEnd=!!prev&&sameGameAs(prev,p)&&endOfPossessionEvent(prev);
  const seq=sequenceNumber(p),prevSeq=sequenceNumber(prev||{});
  const sequenceReset=!!prev&&sameGameAs(prev,p)&&seq!==null&&prevSeq!==null&&seq<=prevSeq;

  const inferredStart=
   explicitPossessionStart(p)||
   keyStart||
   firstGamePlay||
   offenseFlip||
   followsPossessionEnd||
   sequenceReset;

  let bucket=ddBucket(down,Number.isFinite(dist)?dist:null,ytg);

  // P & 10 is reserved for the first offensive snap of a possession.
  if(inferredStart&&down===1&&Number.isFinite(dist)&&Math.abs(dist-10)<.01){
   bucket="P & 10";
  }

  p.down_distance_bucket=bucket;
  p.possession_first_play=inferredStart;
  enriched.push(p);
 });
 return enriched;
}
function firstDownSource(p){
 if(isPenaltyFirstDown(p))return"Penalty";
 if(isScramble(p))return"Scramble";
 if(p.run_pass==="R")return"Rush";
 if(p.run_pass==="P"&&isCompletedPass(p))return"Pass";
 return"Other";
}

function parseRushers(v){const m=String(v||"").match(/^\s*(\d+)/);return m?Number(m[1]):null}
function avg(a){a=a.filter(Number.isFinite);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null}
function med(a){a=a.filter(Number.isFinite).sort((x,y)=>x-y);if(!a.length)return null;let m=Math.floor(a.length/2);return a.length%2?a[m]:(a[m-1]+a[m])/2}
function pct(n,d){return d?100*n/d:null}
function sum(label,p){
 const pass=p.filter(isTruePassAttempt);
 const dropbacks=p.filter(x=>x.run_pass==="P");
 return{label,plays:p.length,ypp:avg(p.map(x=>Number(x.yards))),median:med(p.map(x=>Number(x.yards))),first:pct(p.filter(x=>x.first_down).length,p.length),epa:avg(p.map(x=>Number(x.epa))),expl:pct(p.filter(x=>x.explosive).length,p.length),neg:pct(p.filter(x=>x.negative).length,p.length),sack:pct(dropbacks.filter(isSack).length,dropbacks.length),intr:pct(pass.filter(isInterception).length,pass.length),scr:pct(dropbacks.filter(isScramble).length,dropbacks.length),comp:pct(pass.filter(isCompletedPass).length,pass.length),adv:pct(p.filter(x=>x.num_advantage===true).length,p.length),td:pct(p.filter(x=>x.touchdown).length,p.length)}
}
function group(p,key){return p.reduce((a,x)=>{const k=cleanDisplay(x[key])||"-";(a[k]??=[]).push(x);return a},{})}
function metricRows(p,key,min=1){return Object.entries(group(p,key)).map(([k,v])=>sum(k,v)).filter(r=>r.plays>=min)}
function table(rows){return`<div class=tw><table><thead><tr><th>Label</th><th>Plays</th><th>YPP</th><th>Med</th><th>1st %</th><th>EPA</th><th>Expl %</th><th>Neg %</th><th>Sack %</th><th>INT %</th><th>Scr %</th><th>Comp %</th><th>Adv %</th></tr></thead><tbody>`+rows.map(r=>`<tr><td>${r.label}</td><td>${r.plays}</td><td>${f(r.ypp)}</td><td>${f(r.median,1)}</td><td>${fp(r.first)}</td><td>${f(r.epa)}</td><td>${fp(r.expl)}</td><td>${fp(r.neg)}</td><td>${fp(r.sack)}</td><td>${fp(r.intr)}</td><td>${fp(r.scr)}</td><td>${fp(r.comp)}</td><td>${fp(r.adv)}</td></tr>`).join("")+"</tbody></table></div>"}
function cards(r){return`<div class=cards>${[["Plays",r.plays,""],["Yards / Play",f(r.ypp),"Median "+f(r.median,1)],["Advantage Rate",fp(r.adv),""],["First Down %",fp(r.first),""],["Negative %",fp(r.neg),""],["Completion %",fp(r.comp),""]].map(x=>`<div class=metric><div class=mt>${x[0]}</div><div class=mv>${x[1]}</div>${x[2]?`<div class=ms>${x[2]}</div>`:""}</div>`).join("")}</div>`}

function firstDownStats(p){
 const sourceCounts={Pass:0,Rush:0,Scramble:0,Penalty:0,Other:0};
 p.forEach(x=>sourceCounts[firstDownSource(x)]++);
 const passFirstDowns=p.filter(x=>firstDownSource(x)==="Pass");
 const passAttempts=passFirstDowns.filter(isTruePassAttempt);
 return{
  plays:p.length,
  pass:sourceCounts.Pass,
  rush:sourceCounts.Rush,
  scramble:sourceCounts.Scramble,
  penalty:sourceCounts.Penalty,
  other:sourceCounts.Other,
  comp:pct(passAttempts.filter(isCompletedPass).length,passAttempts.length),
  penaltyPct:pct(sourceCounts.Penalty,p.length)
 };
}
function firstDownCards(p){
 const r=firstDownStats(p);
 return`<div class=cards>
  <div class=metric><div class=mt>First Downs</div><div class=mv>${r.plays}</div></div>
  <div class=metric><div class=mt>Pass 1D</div><div class=mv>${r.pass}</div></div>
  <div class=metric><div class=mt>Rush 1D</div><div class=mv>${r.rush}</div></div>
  <div class=metric><div class=mt>Scramble 1D</div><div class=mv>${r.scramble}</div></div>
  <div class=metric><div class=mt>Penalty 1D</div><div class=mv>${r.penalty}</div><div class=ms>${fp(r.penaltyPct)} of first downs</div></div>
  <div class=metric><div class=mt>Pass Completion %</div><div class=mv>${fp(r.comp)}</div><div class=ms>Completed pass first downs only</div></div>
 </div>`;
}
function firstDownSourceTable(p){
 const counts=Object.entries(group(p,"first_down_source")).map(([label,v])=>({label,plays:v.length,pct:pct(v.length,p.length)})).sort((a,b)=>b.plays-a.plays);
 return`<div class=tw><table><thead><tr><th>First Down Source</th><th>Count</th><th>Share</th></tr></thead><tbody>${counts.map(r=>`<tr><td>${r.label}</td><td>${r.plays}</td><td>${fp(r.pct)}</td></tr>`).join("")}</tbody></table></div>`;
}

function bars(rows,key,title,cls=""){const mx=Math.max(...rows.map(r=>r[key]||0),1);return`<div class=panel><h3>${title}</h3>`+rows.slice(0,12).map(r=>`<div class=barrow><span>${r.label}</span><div class=barbg><div class="bar ${cls}" style="width:${100*(r[key]||0)/mx}%"></div></div><b>${f(r[key],1)}</b></div>`).join("")+"</div>"}
function opts(arr){return["All",...Array.from(new Set(arr.filter(v=>v!==null&&v!==undefined&&String(v)!=="").map(String))).sort()]}

function ddOpts(rows){
 const values=Array.from(new Set(rows.map(x=>x.down_distance_bucket).filter(Boolean)));
 const order=["P & 10","1st & 10","1st & 15+","1st & Other","2nd & 1-3","2nd & 4-6","2nd & 7-9","2nd & 10-12","2nd & 13+","3rd & 1-3","3rd & 4-6","3rd & 7-9","3rd & 10-12","3rd & 13+","4th & 1-3","4th & 4-6","4th & 7-9","4th & 10-12","4th & 13+","1 & Goal","2 & Goal","3 & Goal","4 & Goal"];
 values.sort((a,b)=>{
  const ai=order.indexOf(a),bi=order.indexOf(b);
  return(ai<0?999:ai)-(bi<0?999:bi)||String(a).localeCompare(String(b));
 });
 return["All",...values];
}

function selectHtml(label,key,values,stateName){
 const state=stateName==="fd"?fdFilters:filters;
 return`<label>${label}<select data-state="${stateName}" data-key="${key}">${values.map(v=>`<option ${state[key]===v?"selected":""}>${v}</option>`).join("")}</select></label>`;
}
function attachSelectHandlers(){
 document.querySelectorAll("select[data-state]").forEach(s=>s.onchange=e=>{
   const state=e.target.dataset.state,key=e.target.dataset.key,val=e.target.value;
   if(state==="fd")fdFilters[key]=val;else filters[key]=val;

}

 $("status").innerHTML="<span>Loading Florida Atlantic analytics...</span>";

 // Primary public loader: use the existing published share RPC internally.
 // Coaches do not need a token in the URL.
 try{
  const {data:p,error:e1}=await sb.rpc("get_shared_project",{token:DEFAULT_PUBLIC_SHARE_TOKEN});
  const {data:pl,error:e2}=await sb.rpc("get_shared_plays",{token:DEFAULT_PUBLIC_SHARE_TOKEN});

  if(!e1&&!e2&&p?.length){
   currentProject=p[0];
   plays=enrichPlays(pl||[]);
   filtered=[...plays];
   readOnly=true;
   resetFilters();
   renderDashboard();
   renderRoot();
   return;
  }
 }catch(err){
  console.warn("Internal share loader failed:",err);
 }

 // Secondary fallback: newest published project, when anon RLS allows it.
 const {data:projects,error:projectError}=await sb
  .from("projects")
  .select("*")
  .eq("published",true)
  .order("created_at",{ascending:false})
  .limit(1);

 if(!projectError&&projects?.length){
  currentProject=projects[0];
  const {data:pl,error:playsError}=await sb
   .from("plays")
   .select("*")
   .eq("project_id",currentProject.id);

  if(!playsError){
   plays=enrichPlays(pl||[]);
   filtered=[...plays];
   readOnly=true;
   resetFilters();
   renderDashboard();
   renderRoot();
   return;
  }
 }

 $("dashboard").classList.remove("hide");
 $("dashboard").innerHTML=`<div class="public-error">
  <h2>Florida Atlantic analytics could not be loaded</h2>
  <p>The public share RPC and published-project fallback were both unavailable.</p>
  <p class="note">The app no longer requires a login or URL token. Confirm that the original Florida Atlantic project remains published and that the existing get_shared_project/get_shared_plays RPC functions are still active in Supabase.</p>
 </div>`;
 $("status").innerHTML="<span>Analytics unavailable</span>";
}

function renderRoot(){
 $("status").innerHTML=currentProject
  ?`<span>${plays.length} plays loaded</span><span>Public access</span>`
  :`<span>Loading published project...</span>`;
 show("dashboard",!!currentProject);
}




async function loadShared(token){
 $("status").innerHTML="<span>Loading shared project...</span>";
 const {data:p,error:e1}=await sb.rpc("get_shared_project",{token});
 const {data:pl,error:e2}=await sb.rpc("get_shared_plays",{token});
 if(e1||e2||!p?.length){$("status").innerHTML=`<span>${e1?.message||e2?.message||"Shared project unavailable."}</span>`;return}
 currentProject=p[0];plays=pl||[];filtered=[...plays];readOnly=true;resetFilters();renderDashboard();show("dashboard",true);show("auth",false);show("projectsView",false);show("signOut",false);
}
function resetFilters(){
 filters={offense:"All",defense:"All",formation:"All",personnel:"All",advantage:"All",fzGiven:"All",fzAttacked:"All",downDistance:"All",runPass:"All",route:"All",rushers:"All"};
 fdFilters={downDistance:"All",advantage:"All",runPass:"All",formation:"All",offense:"All",defense:"All"};
 projectionRate=70;
}
function renderDashboard(){
 $("dashboard").innerHTML=`
 <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
   <div><h2 style="margin-bottom:3px">${currentProject.name}</h2><div class=note>${currentProject.subject_team||"-"} · ${currentProject.season||"-"}</div></div>
   
 </div>
 <div id="globalFilters" class="filters"></div>
 <div id="tabs" class="tabs"></div>
 <div id="content"></div>`;

 buildGlobalFilters();buildTabs();applyFilters();
}
function buildGlobalFilters(){
 const fz=["All","FIELD","BOUNDARY","BOX","MOF"];
 $("globalFilters").innerHTML=
 selectHtml("Offense","offense",opts(plays.map(x=>x.offense)),"global")+
 selectHtml("Defense","defense",opts(plays.map(x=>x.defense)),"global")+
 selectHtml("Formation","formation",opts(plays.map(x=>x.formation)),"global")+
 selectHtml("Personnel","personnel",opts(plays.map(x=>x.personnel)),"global")+
 selectHtml("Advantage","advantage",["All","Advantaged","Non-Advantaged"],"global")+
 selectHtml("FZ Given","fzGiven",fz,"global")+
 selectHtml("FZ Attacked","fzAttacked",fz,"global")+
 selectHtml("Down-Distance","downDistance",ddOpts(plays),"global")+
 selectHtml("Run / Pass","runPass",["All","R","P"],"global")+
 selectHtml("Route","route",opts(plays.map(x=>x.route)),"global")+
 selectHtml("Rushers","rushers",opts(plays.map(x=>x.pass_rushers)),"global");
 attachSelectHandlers();
}
function buildTabs(){
 const tabs=["Dashboard","Offense","Defense","Team Comparison","Projected Totals","First Down Explorer","Field Zones","Routes","Situations"];
 $("tabs").innerHTML=tabs.map(t=>`<button class="${t===tab?"a":""}" onclick='setTab(${JSON.stringify(t)})'>${t}</button>`).join("");
}
window.setTab=t=>{tab=t;buildTabs();renderContent()}

function applyFilters(){
 filtered=plays.filter(p=>
  (filters.offense==="All"||p.offense===filters.offense)&&
  (filters.defense==="All"||p.defense===filters.defense)&&
  (filters.formation==="All"||p.formation===filters.formation)&&
  (filters.personnel==="All"||String(p.personnel)===filters.personnel)&&
  (filters.advantage==="All"||(filters.advantage==="Advantaged"?p.num_advantage===true:p.num_advantage===false))&&
  (filters.fzGiven==="All"||p.fz_advantage===filters.fzGiven)&&
  (filters.fzAttacked==="All"||p.fz_attacked===filters.fzAttacked)&&
  (filters.downDistance==="All"||p.down_distance_bucket===filters.downDistance)&&
  (filters.runPass==="All"||p.run_pass===filters.runPass)&&
  (filters.route==="All"||String(p.route||"")===filters.route)&&
  (filters.rushers==="All"||String(p.pass_rushers||"")===filters.rushers)
 );
 $("status").innerHTML=`<span>${plays.length} plays loaded</span><span>${filtered.length} after filters</span><span>${new Set(plays.map(x=>x.offense)).size} offenses</span><span>${new Set(plays.map(x=>x.defense)).size} defenses</span>`;
 renderContent();
}
function renderContent(){
 const c=$("content"),overall=sum("Filtered",filtered);
 const advRows=[sum("Advantaged",filtered.filter(x=>x.num_advantage===true)),sum("Non-Advantaged",filtered.filter(x=>x.num_advantage===false))];
 const offenseRows=metricRows(filtered,"offense").sort((a,b)=>b.plays-a.plays);
 const defenseRows=metricRows(filtered,"defense").sort((a,b)=>b.plays-a.plays);
 const formRows=metricRows(filtered,"formation").sort((a,b)=>b.plays-a.plays);
 const efficient=[...formRows].filter(r=>r.plays>=10).sort((a,b)=>(b.ypp??-999)-(a.ypp??-999)).slice(0,12);

 if(tab==="Dashboard"){
   c.innerHTML=cards(overall)+`<div class=two>${bars(advRows,"ypp","Advantage Split: YPP")}${bars(efficient,"ypp","Formation Efficiency","g")}</div>`;
 }
 else if(tab==="Offense"){
   c.innerHTML="<h2>Offensive Profile</h2>"+table(offenseRows)+"<h2>Formations</h2>"+table(formRows.slice(0,20));
 }
 else if(tab==="Defense"){
   c.innerHTML="<h2>Opponent Defense Results</h2><p class=note>This page reports offensive production allowed by each defense. The separate Defense Scheme workspace is reserved for fronts, coverage and pressure structure.</p>"+table(defenseRows)+`<div class=two>${bars(defenseRows,"ypp","YPP Allowed")}${bars(defenseRows,"neg","Negative Plays Forced","n")}</div>`;
 }
 else if(tab==="Team Comparison"){
   c.innerHTML=`<h2>Team Comparison</h2><div class=two><div><h3>Offensive Production</h3>${table(offenseRows)}</div><div><h3>Defensive Production Allowed</h3>${table(defenseRows)}</div></div>`;
 }
 else if(tab==="Projected Totals"){
   const adv=advRows[0],non=advRows[1],r=projectionRate/100,m=k=>(adv[k]??0)*r+(non[k]??0)*(1-r);
   const row={label:projectionRate+"% Advantage",plays:filtered.length,ypp:m("ypp"),median:m("median"),first:m("first"),epa:m("epa"),expl:m("expl"),neg:m("neg"),sack:m("sack"),intr:m("intr"),scr:m("scr"),comp:m("comp"),adv:projectionRate,td:m("td")};
   const totalPlays=70,projYards=(row.ypp??0)*totalPlays,projFD=(row.first??0)/100*totalPlays,projExpl=(row.expl??0)/100*totalPlays,projNeg=(row.neg??0)/100*totalPlays,projPoints=(row.td??0)/100*totalPlays*7;
   c.innerHTML=`<h2>Projected Totals</h2><div class=panel><div class=slider><b>Advantage Execution Rate</b><input id="projSlider" type="range" min="0" max="100" value="${projectionRate}"><strong>${projectionRate}%</strong></div><p class=note>Uses actual advantaged and non-advantaged production from the current filtered sample. Game estimate assumes 70 plays.</p></div>
   <div class=cards>
   <div class=metric><div class=mt>Projected YPP</div><div class=mv>${f(row.ypp)}</div></div>
   <div class=metric><div class=mt>Projected Yards</div><div class=mv>${f(projYards,0)}</div></div>
   <div class=metric><div class=mt>Projected First Downs</div><div class=mv>${f(projFD,1)}</div></div>
   <div class=metric><div class=mt>Projected Explosives</div><div class=mv>${f(projExpl,1)}</div></div>
   <div class=metric><div class=mt>Projected Negatives</div><div class=mv>${f(projNeg,1)}</div></div>
   <div class=metric><div class=mt>Projected Points</div><div class=mv>${f(projPoints,1)}</div></div></div>
   ${table([row])}`;
   $("projSlider").oninput=e=>{projectionRate=Number(e.target.value);renderContent()}
 }
 else if(tab==="First Down Explorer"){
   const fd=filtered.filter(x=>x.first_down)
    .filter(x=>fdFilters.downDistance==="All"||x.down_distance_bucket===fdFilters.downDistance)
    .filter(x=>fdFilters.advantage==="All"||(fdFilters.advantage==="Advantaged"?x.num_advantage===true:x.num_advantage===false))
    .filter(x=>fdFilters.runPass==="All"||x.run_pass===fdFilters.runPass)
    .filter(x=>fdFilters.formation==="All"||x.formation===fdFilters.formation)
    .filter(x=>fdFilters.offense==="All"||x.offense===fdFilters.offense)
    .filter(x=>fdFilters.defense==="All"||x.defense===fdFilters.defense);
   fd.forEach(x=>x.first_down_source=firstDownSource(x));
   c.innerHTML=`<h2>First Down Explorer</h2><p class=note>Only plays credited with a first down are loaded. Pass Completion % uses completed pass first downs only; runs, scrambles and penalty first downs are excluded.</p><div class=subfilters>
   ${selectHtml("Down-Distance","downDistance",ddOpts(filtered),"fd")}
   ${selectHtml("Advantage","advantage",["All","Advantaged","Non-Advantaged"],"fd")}
   ${selectHtml("Run / Pass","runPass",["All","R","P"],"fd")}
   ${selectHtml("Formation","formation",opts(filtered.map(x=>x.formation)),"fd")}
   ${selectHtml("Offense","offense",opts(filtered.map(x=>x.offense)),"fd")}
   ${selectHtml("Defense","defense",opts(filtered.map(x=>x.defense)),"fd")}
   </div>${firstDownCards(fd)}
   <div class=two><div><h3>First Down Source</h3>${firstDownSourceTable(fd)}</div><div><h3>First Downs by Down-Distance</h3>${table(metricRows(fd,"down_distance_bucket").sort((a,b)=>b.plays-a.plays))}</div></div>
   <h3>First Downs by Formation</h3>${table(metricRows(fd,"formation").sort((a,b)=>b.plays-a.plays))}`;
   attachSelectHandlers();
 }
 else if(tab==="Field Zones"){
   const form=filters.formation!=="All"?filters.formation:(formRows[0]?.label||"");
   const z=["FIELD","BOUNDARY","BOX"],p=filtered.filter(x=>x.formation===form);
   const body=z.map(g=>`<tr><td class=rowlabel>${g}</td>`+z.map(a=>{const r=sum(a,p.filter(x=>x.fz_advantage===g&&x.fz_attacked===a));return`<td><b>${f(r.ypp,1)} YPP</b><span>Med ${f(r.median,1)}</span><span>${fp(r.first)} 1st</span><span>${fp(r.neg)} neg</span><span>n=${r.plays}</span></td>`}).join("")+"</tr>").join("");
   c.innerHTML=`<h2>FZ Given x FZ Attacked — ${form||"No formation"}</h2><div class=tw><table class=matrix><thead><tr><th>FZ Given</th><th>Attack Field</th><th>Attack Boundary</th><th>Attack Box</th></tr></thead><tbody>${body}</tbody></table></div>`;
 }
 else if(tab==="Routes"){
   c.innerHTML="<h2>Routes</h2>"+table(metricRows(filtered.filter(x=>x.run_pass==="P"&&x.route),"route",2).sort((a,b)=>b.plays-a.plays).slice(0,40));
 }
 else if(tab==="Situations"){
   c.innerHTML="<h2>Situations</h2>"+table(metricRows(filtered.filter(x=>x.down_distance_bucket!=="Unknown"&&x.down_distance_bucket!=="1st & Other"),"down_distance_bucket",5));
 }
}
init();
</script>
</body>
</html>
